{% extends "base.html" %}
{% block title %}Page Not Found — Potato Wiz{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;">
  <div class="empty-state" style="max-width:480px;">
    <div style="font-size:80px;margin-bottom:var(--space-5);" aria-hidden="true">🥔</div>
    <h1 style="font-size:clamp(28px,3vw,40px);font-weight:900;letter-spacing:-0.02em;
               margin-bottom:var(--space-3);">Page Not Found</h1>
    <p style="color:var(--text-muted);margin-bottom:var(--space-8);font-size:var(--text-md);">
      This page seems to have gone potato-mode. It doesn't exist (or was moved).
    </p>
    <div style="display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap;">
      <a href="{{ url_for('home.index') }}" class="btn btn-primary">Go Home</a>
      <a href="{{ url_for('games.games_library') }}" class="btn btn-secondary">Browse Games</a>
    </div>
  </div>
</div>
{% endblock %}
